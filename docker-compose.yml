version: '3.8'

services:
  comic-drama-app:
    build: .
    container_name: comic-drama-app
    # B-24 F-08：端口只绑 127.0.0.1（localhost-only），避免暴露到所有网卡
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./output:/app/output
      - ./novels:/app/novels
      - ./app/config:/app/app/config
    environment:
      - FLASK_ENV=production
      - COMFYUI_URL=http://host.docker.internal:8188
    # 审计 P2-27（2026-09-29）：Linux 宿主机上 host.docker.internal 默认不存在，
    # 必须指向宿主网关（Win/Mac Docker Desktop 内置该名称，此行无副作用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
